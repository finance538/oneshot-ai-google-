<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#0a0b0e">
    <title>oneShot · لا يوجد اتصال</title>
    <style>
      :root{color-scheme:dark;--page:#0a0b0e;--surface:#12141a;--text:#f5f5f2;--muted:#a1a6b2;--border:#ffffff14}
      :root[data-theme="light"]{color-scheme:light;--page:#f5f4f1;--surface:#fff;--text:#12141a;--muted:#626b75;--border:#12141a18}
      *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--page);color:var(--text);font-family:Outfit,Cairo,sans-serif;text-align:center;padding:24px}main{width:min(100%,460px);padding:40px 28px;background:var(--surface);border:1px solid var(--border);border-radius:24px}img{width:88px;height:88px}h1{font-size:25px;line-height:1.6;margin-top:25px}p{font-size:15px;line-height:2;color:var(--muted)}button{background:#c94200;color:#fff;border:1px solid #ff5500;min-height:48px;padding:13px 25px;border-radius:11px;font:inherit;cursor:pointer}button:focus-visible{outline:2px solid #ff5500;outline-offset:4px}small{display:block;color:var(--muted);margin-top:28px;letter-spacing:.1em;font-size:10px}
    </style>
  </head>
  <body>
    <main>
      <img src="/icon.svg" alt="oneShot" width="88" height="88">
      <h1>نحتاج إلى الاتصال بالإنترنت.</h1>
      <p>حفاظاً على أمانك، لا تُحفظ بيانات العملاء أو صفحات الدفع دون اتصال. أعد الاتصال ثم حدّث الصفحة.</p>
      <button id="retry">إعادة المحاولة</button>
      <small dir="ltr">oneShot / PAYMENT STUDIO</small>
    </main>
    <script src="/offline.js"></script>
  </body>
</html>
