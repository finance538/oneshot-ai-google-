name: Build Android APK (oneShot Hub)

on:
  push:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - 'scripts/pin-android-sdk.sh'
      - 'resources/android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web Application
        run: npm run build
        env:
          NODE_ENV: production

      - name: Setup Java (JDK 21)
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '21'

      # The Android SDK is preinstalled on ubuntu-latest. Do NOT use
      # android-actions/setup-android@v3: it runs `sdkmanager tools`, a package
      # that no longer exists in the SDK, and the step fails.
      - name: Configure Android SDK
        run: |
          set -e
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "SDK: $SDK"
          ls "$SDK/platforms" "$SDK/build-tools"
          {
            echo "ANDROID_SDK_ROOT=$SDK"
            echo "ANDROID_HOME=$SDK"
          } >> "$GITHUB_ENV"
          SDK_BIN="$SDK/cmdline-tools/latest/bin"
          [ -d "$SDK_BIN" ] || SDK_BIN="$(dirname "$(find "$SDK/cmdline-tools" -name sdkmanager -type f | head -1)")"
          echo "$SDK_BIN:$SDK/platform-tools" >> "$GITHUB_PATH"

      - name: Add Android Platform
        run: |
          set -e
          npx cap add android || true
          bash scripts/pin-android-sdk.sh
          npx cap sync android

      - name: Build Debug APK
        run: |
          set -e
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        if: success()
        run: |
          set -e
          APK="$(find android/app/build/outputs/apk -name '*.apk' | head -1)"
          echo "built: $APK"
          cp "$APK" oneshot-hub.apk
          ls -lh oneshot-hub.apk
          file oneshot-hub.apk

      - name: Upload APK (artifact)
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: OneShot-Hub-APK
          path: oneshot-hub.apk
          retention-days: 30

      # Stable public download URL used by the site buttons:
      # https://github.com/finance538/oneshot-ai-google-/releases/latest/download/oneshot-hub.apk
      - name: Publish to 'app-latest' release
        if: success()
        uses: softprops/action-gh-release@v3
        with:
          tag_name: app-latest
          name: oneShot Hub — APK (latest)
          body: |
            أحدث نسخة APK من تطبيق oneShot Hub، تُبنى تلقائيًا من فرع main.
            Latest oneShot Hub Android build, rebuilt automatically from main.
          files: oneshot-hub.apk
          make_latest: true
