[build]
command = "npm run build"
publish = "dist"

[build.environment]
# Firebase web SDK configuration is public. Keep it in a separate JSON asset so
# this exception never excludes executable bundles or server-side credentials.
SECRETS_SCAN_OMIT_PATHS = "firebase-applet-config.json,dist/assets/firebase-applet-config-*.json"

[functions]
directory = "netlify/functions"

# Same-domain download URL: /oneshot-hub.apk is streamed by netlify/edge-functions/oneshot-hub-apk.ts
[[edge_functions]]
path = "/oneshot-hub.apk"
function = "oneshot-hub-apk"

[[redirects]]
  from = "/api/*"
  to = "http://187.7.65.45:8080/api/:splat"
  status = 200
  force = true

[[redirects]]
from = "/*"
to = "/index.html"
status = 200

[[headers]]
for = "/*"
[headers.values]
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
X-Frame-Options = "SAMEORIGIN"
Permissions-Policy = "camera=(), microphone=(self), geolocation=(self)"

[[headers]]
for = "/sw.js"
[headers.values]
Cache-Control = "no-cache, no-store, must-revalidate"
Service-Worker-Allowed = "/"

[[headers]]
for = "/pay/*"
[headers.values]
Cache-Control = "no-store"

[[headers]]
for = "/p/*"
[headers.values]
Cache-Control = "no-store"

[[headers]]
for = "/sign-in"
[headers.values]
Cache-Control = "no-store"

[[headers]]
for = "/sign-up"
[headers.values]
Cache-Control = "no-store"

[[headers]]
for = "/index.html"
[headers.values]
Cache-Control = "no-cache"

[[headers]]
for = "/oneshot-hub.apk"
[headers.values]
Content-Type = "application/vnd.android.package-archive"
Content-Disposition = "attachment; filename=\"oneshot-hub.apk\""
Cache-Control = "public, max-age=300"
